# Painel de artigos (Decap CMS) — acessível em /admin
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Novo artigo: {{slug}}'
    update: 'Edita artigo: {{slug}}'
    delete: 'Remove artigo: {{slug}}'
    uploadMedia: 'Envia arquivo: {{path}}'
    deleteMedia: 'Remove arquivo: {{path}}'

locale: pt
site_url: /
display_url: /
logo_url: /assets/logo-full.png

# Fotos e PDFs enviados pelo painel ficam em /uploads
media_folder: uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: artigos
    label: Artigos
    label_singular: Artigo
    description: Os artigos aparecem na seção "Conteúdo" do site e em /artigos.
    folder: content/artigos
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} · {{date | date("DD/MM/YYYY")}}'
    sortable_fields: ['date', 'title', 'category']
    preview_path: 'artigos/{{slug}}/'
    fields:
      - { name: title, label: Título, widget: string }
      - { name: date, label: Data de publicação, widget: datetime, date_format: 'DD/MM/YYYY', time_format: false, format: 'YYYY-MM-DD' }
      - name: category
        label: Categoria
        widget: select
        options: [Metodologia, Ensino, Mentalidade, Ginástica, Carreira]
      - { name: author, label: Autor, widget: string, default: Henrique Scomparin, required: false }
      - { name: summary, label: Resumo, widget: text, hint: 'Duas ou três frases. Aparece no card do artigo e no Google.' }
      - { name: cover, label: Foto de capa, widget: image, required: false, hint: 'Aparece no card do artigo (home e lista de artigos).' }
      - { name: body, label: Texto, widget: markdown, hint: 'Dá para inserir fotos no meio do texto pelo botão "+".' }
      - name: gallery
        label: Fotos complementares
        label_singular: foto
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.caption}}'
        hint: 'Aparecem em galeria no final do artigo.'
        fields:
          - { name: image, label: Foto, widget: image }
          - { name: caption, label: Legenda, widget: string, required: false }
      - name: pdf
        label: PDF para download
        widget: object
        required: false
        collapsed: true
        hint: 'Opcional. Deixe vazio se o artigo não tiver material para baixar.'
        fields:
          - { name: file, label: Arquivo PDF, widget: file, required: false, media_library: { config: { multiple: false } } }
          - { name: title, label: Nome do material, widget: string, required: false, hint: 'Ex.: Guia de progressões de ginástica' }
          - { name: description, label: Descrição curta, widget: text, required: false }
          - { name: require_phone, label: Pedir telefone antes do download, widget: boolean, default: true }

  - name: agenda
    label: Agenda
    description: Datas que aparecem no topo da home, na seção do curso e ao lado de todos os artigos.
    files:
      - name: agenda
        label: Próximas datas
        file: content/agenda.json
        fields:
          - name: proximo_curso
            label: Próxima turma do Curso de Desenvolvimento
            widget: object
            fields:
              - { name: titulo, label: Nome do curso, widget: string, default: Curso de Desenvolvimento para Treinadores }
              - { name: datas, label: Datas (como devem aparecer), widget: string, required: false, hint: 'Ex.: 21 e 22 de novembro. Deixe vazio se ainda não houver data.' }
              - { name: ate, label: Último dia do curso, widget: datetime, date_format: 'DD/MM/YYYY', time_format: false, format: 'YYYY-MM-DD', required: false, hint: 'Depois desse dia a data some sozinha do site (na próxima publicação).' }
              - { name: local, label: Local, widget: string, required: false, hint: 'Ex.: CrossFit Rio Preto, São José do Rio Preto (SP)' }
          - name: outros
            label: Outras formações e clínicas
            label_singular: formação
            widget: list
            summary: '{{fields.nome}} · {{fields.info}}'
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: info, label: Data ou situação, widget: string, default: Sob consulta }
